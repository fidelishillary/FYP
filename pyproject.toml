[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pemd"
version = "0.1.0"
description = "A static-first hybrid framework for Windows PE malware detection using reverse engineering-guided feature extraction and machine learning (FYP, Universiti Teknologi PETRONAS)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Fidelis Hillary bin Leanad" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "pefile>=2023.2.7",
    "lief>=0.14",
    "capstone>=5.0",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "requests>=2.31",
]

[project.optional-dependencies]
yara = ["yara-python>=4.5"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
pemd = "pemd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B905", "UP017"]

[tool.ruff.lint.isort]
known-first-party = ["pemd", "tests"]
